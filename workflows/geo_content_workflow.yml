app:
  name: GEO Blog + Product Detail Page Workflow (Reusable)
  description: 'Cross-category GEO content production workflow: Product Parsing -> Intent/Outline -> Parallel Blog & PDP Generation
    -> Fact Checking -> De-AI Polishing -> JSON-LD Assembly & Automated QA.'
  icon: 📝
  icon_background: '#E8F4FD'
  mode: workflow
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: true
      number_limits: 1
      allowed_file_types:
      - document
      - custom
      allowed_file_extensions:
      - .json
      - .txt
      allowed_file_upload_methods:
      - local_file
      - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - id: node_start-source-node_check_file-target
      type: custom
      source: node_start
      sourceHandle: source
      target: node_check_file
      targetHandle: target
      zIndex: 0
      data:
        isInIteration: false
        sourceType: start
        targetType: if-else
    - id: node_check_file-true-node_doc_extractor-target
      type: custom
      source: node_check_file
      sourceHandle: 'true'
      target: node_doc_extractor
      targetHandle: target
      zIndex: 0
      data:
        isInIteration: false
        sourceType: if-else
        targetType: document-extractor
    - id: node_doc_extractor-source-node_input_merge-target
      type: custom
      source: node_doc_extractor
      sourceHandle: source
      target: node_input_merge
      targetHandle: target
      zIndex: 0
      data:
        isInIteration: false
        sourceType: document-extractor
        targetType: variable-aggregator
    - id: node_check_file-false-node_input_merge-target
      type: custom
      source: node_check_file
      sourceHandle: 'false'
      target: node_input_merge
      targetHandle: target
      zIndex: 0
      data:
        isInIteration: false
        sourceType: if-else
        targetType: variable-aggregator
    - id: node_input_merge-source-node_parse_product-target
      type: custom
      source: node_input_merge
      sourceHandle: source
      target: node_parse_product
      targetHandle: target
      zIndex: 0
      data:
        isInIteration: false
        sourceType: variable-aggregator
        targetType: code
    - id: node_parse_product-source-node_outline_planner-target
      type: custom
      source: node_parse_product
      sourceHandle: source
      target: node_outline_planner
      targetHandle: target
      zIndex: 0
      data:
        isInIteration: false
        sourceType: code
        targetType: llm
    - id: node_outline_planner-source-node_blog_draft-target
      type: custom
      source: node_outline_planner
      sourceHandle: source
      target: node_blog_draft
      targetHandle: target
      zIndex: 0
      data:
        isInIteration: false
        sourceType: llm
        targetType: llm
    - id: node_outline_planner-source-node_pdp_draft-target
      type: custom
      source: node_outline_planner
      sourceHandle: source
      target: node_pdp_draft
      targetHandle: target
      zIndex: 0
      data:
        isInIteration: false
        sourceType: llm
        targetType: llm
    - id: node_blog_draft-source-node_fact_checker-target
      type: custom
      source: node_blog_draft
      sourceHandle: source
      target: node_fact_checker
      targetHandle: target
      zIndex: 0
      data:
        isInIteration: false
        sourceType: llm
        targetType: llm
    - id: node_pdp_draft-source-node_fact_checker-target
      type: custom
      source: node_pdp_draft
      sourceHandle: source
      target: node_fact_checker
      targetHandle: target
      zIndex: 0
      data:
        isInIteration: false
        sourceType: llm
        targetType: llm
    - id: node_fact_checker-source-node_de_ai_polisher-target
      type: custom
      source: node_fact_checker
      sourceHandle: source
      target: node_de_ai_polisher
      targetHandle: target
      zIndex: 0
      data:
        isInIteration: false
        sourceType: llm
        targetType: llm
    - id: node_de_ai_polisher-source-node_jsonld_qa-target
      type: custom
      source: node_de_ai_polisher
      sourceHandle: source
      target: node_jsonld_qa
      targetHandle: target
      zIndex: 0
      data:
        isInIteration: false
        sourceType: llm
        targetType: code
    - id: node_jsonld_qa-source-node_auto_publish-target
      type: custom
      source: node_jsonld_qa
      sourceHandle: source
      target: node_auto_publish
      targetHandle: target
      zIndex: 0
      data:
        isInIteration: false
        sourceType: code
        targetType: http-request
    - id: node_auto_publish-source-node_end-target
      type: custom
      source: node_auto_publish
      sourceHandle: source
      target: node_end
      targetHandle: target
      zIndex: 0
      data:
        isInIteration: false
        sourceType: http-request
        targetType: end
    nodes:
    - id: node_start
      type: custom
      position:
        x: 40
        y: 260
      positionAbsolute:
        x: 40
        y: 260
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 170
      data:
        type: start
        title: 0. 输入产品 JSON
        desc: 支持直接上传 .json 文件或粘贴 JSON 文本（二选一），兼容任意品类与 API 调用
        selected: false
        variables:
        - label: product_json_file (直接上传产品 .json 文件，推荐)
          variable: product_json_file
          type: file
          required: false
          allowed_file_types:
          - custom
          - document
          allowed_file_extensions:
          - .json
          - .txt
          allowed_file_upload_methods:
          - local_file
          - remote_url
          options: []
        - label: product_json (或直接粘贴 JSON 文本 / API 传参)
          variable: product_json
          type: paragraph
          required: false
          max_length: 16000
          options: []
        - label: extra_user_request (可选，用于诱导虚构卖点测试)
          variable: extra_user_request
          type: paragraph
          required: false
          max_length: 2000
          options: []
        - label: word_count_mode (默认按 PDF 1200-1500 词，或按 JSON 覆盖)
          variable: word_count_mode
          type: select
          required: true
          default: pdf_default
          options:
          - pdf_default
          - json_override
    - id: node_check_file
      type: custom
      position:
        x: 340
        y: 260
      positionAbsolute:
        x: 340
        y: 260
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 126
      data:
        type: if-else
        title: 0B. 判断是否上传文件
        desc: 若上传了 .json 文件则自动提取文本，否则使用文本框/API 传入的 JSON
        selected: false
        cases:
        - case_id: 'true'
          id: 'true'
          logical_operator: and
          conditions:
          - id: cond_has_json_file
            varType: file
            variable_selector:
            - node_start
            - product_json_file
            comparison_operator: exists
            value: ''
    - id: node_doc_extractor
      type: custom
      position:
        x: 640
        y: 150
      positionAbsolute:
        x: 640
        y: 150
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 98
      data:
        type: document-extractor
        title: 0C. 读取 JSON 文件内容
        desc: 自动读取上传的 .json 文件文本内容
        selected: false
        is_array_file: false
        variable_selector:
        - node_start
        - product_json_file
    - id: node_input_merge
      type: custom
      position:
        x: 940
        y: 260
      positionAbsolute:
        x: 940
        y: 260
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 108
      data:
        type: variable-aggregator
        title: 0D. 汇聚 JSON 文本
        desc: 统一文件提取内容与文本框输入，输出给下游解析节点
        selected: false
        output_type: string
        variables:
        - - node_doc_extractor
          - text
        - - node_start
          - product_json
        advanced_settings:
          group_enabled: false
          groups: []
    - id: node_parse_product
      type: custom
      position:
        x: 1240
        y: 260
      positionAbsolute:
        x: 1240
        y: 260
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 98
      data:
        type: code
        title: 1. 产品解析与事实契约
        desc: 动态提取 JSON 路径事实、识别缺失字段、生成禁用主张清单与字数范围
        selected: false
        code_language: python3
        code: |
          import json


          def _flatten(obj, prefix=""):
              flat = {}
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      path = f"{prefix}.{k}" if prefix else k
                      if isinstance(v, dict):
                          flat.update(_flatten(v, path))
                      elif isinstance(v, list):
                          flat[path] = ", ".join(str(x) for x in v)
                      elif v is not None and str(v).strip() != "":
                          flat[path] = str(v)
              return flat


          def main(product_json: str, extra_user_request: str, word_count_mode: str) -> dict:
              raw = (product_json or "").strip()
              if raw.startswith("```"):
                  lines = raw.splitlines()
                  raw = "\n".join(lines[1:-1] if lines[-1].strip().startswith("```") else lines[1:])

              data = json.loads(raw)

              brand = data.get("brand", {}) or {}
              product = data.get("product", {}) or {}
              facts = product.get("facts", {}) or {}
              content_req = data.get("content_requests") if isinstance(data.get("content_requests"), dict) else {}
              blog_req = content_req.get("blog") if isinstance(content_req.get("blog"), dict) else {}
              pdp_req = content_req.get("product_page") if isinstance(content_req.get("product_page"), dict) else {}
              paths = data.get("suggested_paths", {}) or {}

              # Flatten ONLY confirmed facts with exact JSON paths for provenance grounding
              confirmed_flat = {}
              if brand.get("name"):
                  confirmed_flat["brand.name"] = str(brand["name"])
              for key in ("id", "name", "category"):
                  if product.get(key):
                      confirmed_flat[f"product.{key}"] = str(product[key])
              confirmed_flat.update(_flatten(facts, "product.facts"))
              if product.get("target_scenarios"):
                  confirmed_flat["product.target_scenarios"] = ", ".join(
                      str(s) for s in product["target_scenarios"]
                  )

              # Detect absent common commerce attributes (generic, category-agnostic)
              missing_fields = []
              price_obj = facts.get("price")
              if not isinstance(price_obj, dict) or price_obj.get("value") is None:
                  missing_fields.append("product.facts.price")
              if not facts.get("care"):
                  missing_fields.append("product.facts.care")
              if not facts.get("colors"):
                  missing_fields.append("product.facts.colors")
              if not facts.get("material"):
                  missing_fields.append("product.facts.material")

              # Resolve word count strategy: PDF default (1200-1500) vs JSON override (e.g. 600-800)
              mode = (word_count_mode or "pdf_default").strip().lower()
              json_blog_range = blog_req.get("target_words", [600, 800])
              if mode == "json_override" and isinstance(json_blog_range, list) and len(json_blog_range) == 2:
                  blog_range = [int(json_blog_range[0]), int(json_blog_range[1])]
              else:
                  blog_range = [1200, 1500]

              json_pdp_range = pdp_req.get("target_words", [250, 400])
              if isinstance(json_pdp_range, list) and len(json_pdp_range) == 2:
                  pdp_range = [int(json_pdp_range[0]), int(json_pdp_range[1])]
              else:
                  pdp_range = [250, 400]

              unsupported_claims = data.get("unsupported_claims", []) or []
              extra_req = (extra_user_request or "").strip() or "None"

              return {
                  "normalized_product_json": json.dumps(data, ensure_ascii=False, indent=2),
                  "confirmed_facts_flat": json.dumps(confirmed_flat, ensure_ascii=False, indent=2),
                  "missing_fields_json": json.dumps(missing_fields, ensure_ascii=False),
                  "unsupported_claims_json": json.dumps(unsupported_claims, ensure_ascii=False),
                  "extra_user_request_clean": extra_req,
                  "brand_name": str(brand.get("name", "")),
                  "product_name": str(product.get("name", "")),
                  "product_category": str(product.get("category", "general")),
                  "blog_topic": str(blog_req.get("topic", f"How to Choose {product.get('name', 'This Product')}")),
                  "blog_word_range": f"{blog_range[0]}-{blog_range[1]}",
                  "pdp_word_range": f"{pdp_range[0]}-{pdp_range[1]}",
                  "suggested_blog_path": str(paths.get("blog", "/blog/buying-guide")),
                  "suggested_pdp_path": str(paths.get("product_page", "/products/item")),
              }
        variables:
        - variable: product_json
          value_selector:
          - node_input_merge
          - output
        - variable: extra_user_request
          value_selector:
          - node_start
          - extra_user_request
        - variable: word_count_mode
          value_selector:
          - node_start
          - word_count_mode
        outputs:
          normalized_product_json:
            type: string
            children: null
          confirmed_facts_flat:
            type: string
            children: null
          missing_fields_json:
            type: string
            children: null
          unsupported_claims_json:
            type: string
            children: null
          extra_user_request_clean:
            type: string
            children: null
          brand_name:
            type: string
            children: null
          product_name:
            type: string
            children: null
          product_category:
            type: string
            children: null
          blog_topic:
            type: string
            children: null
          blog_word_range:
            type: string
            children: null
          pdp_word_range:
            type: string
            children: null
          suggested_blog_path:
            type: string
            children: null
          suggested_pdp_path:
            type: string
            children: null
    - id: node_outline_planner
      type: custom
      position:
        x: 1560
        y: 260
      positionAbsolute:
        x: 1560
        y: 260
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 98
      data:
        type: llm
        title: 2. GEO 意图与双页大纲规划
        desc: 按品类自动推导选购维度，规划信息型 Blog 与购买决策型 PDP 大纲
        selected: false
        context:
          enabled: false
          variable_selector: []
        model:
          provider: langgenius/openai/openai
          name: gpt-4o
          mode: chat
          completion_params:
            temperature: 0.3
        prompt_template:
        - id: node_outline_planner_sys
          role: system
          text: |-
            You are a senior Generative Engine Optimization (GEO) strategist and editorial director modeling the plainspoken, reader-first journalism of *Real Men Real Style*, *REI Expert Advice*, and *The Strategist*.
            Your job is to plan two complementary English pages from ANY structured product JSON — with ZERO category hardcoding.

            RULES:
            1. STRICT FACT BOUNDARY: Only treat entries inside `confirmed_facts_flat` as product facts. Never invent specifications, certifications, testing numbers, warranties, return policies, inventory, shipping terms, or reviews.
            2. MISSING FIELDS: Any field listed in `missing_fields` MUST NOT be guessed or promised in either page outline. Adapt the outline naturally so the page stays useful without fabricating missing specs.
            3. UNSUPPORTED CLAIMS GUARDRAIL: Never plan sections or claims asserting anything in `unsupported_claims` or unverified demands inside `extra_user_request`. Log rejected demands under `rejected_user_requests`.
            4. EDITORIAL BLOG ARCHITECTURE (NO AD-COPY STRUCTURE):
               - Opening hook: Plan a vivid, relatable 2-sentence everyday frustration scene specific to `product.category` (NO brand mention in the intro!).
               - Follow the intro with a concise `## Key Takeaways` block (4 bullets) for both human skimmers and AI answer engines.
               - Plan 3–4 natural, unnumbered editorial H2s (NEVER use `1. / 2. / 3.` textbook numbering and NEVER plan a separate promotional H2 named after the brand or "Grounded Product Example").
               - Plan one `## Where to Spend, Where to Save, and What to Check` section that leads with honest shopper value advice, a 5-bullet universal checklist, and ONE understated parenthetical mention of the brand's product (`like the [Brand Product Name](suggested_pdp_path)`).
               - Plan a `## Frequently Asked Questions` section with at least 3 sharp shopper Q&As.
               - Do NOT plan lawyer-style checkout/return-policy reminders in normal articles; simply omit unconfirmed terms cleanly.
            5. PRODUCT DETAIL PAGE ARCHITECTURE (`product_detail`):
               - Purchase-decision intent ("Is this specific product right for me?").
               - Focus strictly on confirmed product attributes, fit/scenario suitability, care (if provided), and >=3 transparent purchase FAQs.

            OUTPUT FORMAT:
            Return ONLY valid JSON (no prose outside JSON) matching this schema:
            {
              "category_buying_dimensions": ["string (4-6 dimensions tailored to this product category)"],
              "blog_plan": {
                "search_intent": "informational",
                "meta_title": "string (50-60 chars)",
                "meta_description": "string (140-160 chars)",
                "h1": "string",
                "target_word_range": [1200, 1500],
                "lived_in_opening_scene": "string (vivid everyday frustration for this category, zero brand mention)",
                "key_takeaways_plan": ["string (4 concise bullets)"],
                "sections": [
                  {"h2": "string (natural, unnumbered editorial title)", "purpose": "string", "opening_direct_answer_angle": "string (natural lead sentence, NO literal 'Direct answer:' label)", "fact_boundary_note": "general_advice | parenthetical_product_example"}
                ],
                "faq_questions": ["string (at least 3)"],
                "internal_link_anchor_plan": "string (parenthetical value-advice anchor pointing to suggested_paths.product_page)"
              },
              "pdp_plan": {
                "search_intent": "purchase_decision",
                "meta_title": "string (50-60 chars)",
                "meta_description": "string (140-160 chars)",
                "h1": "string",
                "target_word_range": [250, 400],
                "sections": [
                  {"h2": "string", "confirmed_facts_to_cover": ["json_path"]}
                ],
                "faq_questions": ["string (at least 3)"]
              },
              "rejected_user_requests": [
                {"requested_claim": "string", "reason": "string"}
              ]
            }
        - id: node_outline_planner_usr
          role: user
          text: |-
            Product Category: {{#node_parse_product.product_category#}}
            Brand & Product: {{#node_parse_product.brand_name#}} {{#node_parse_product.product_name#}}
            Blog Topic: {{#node_parse_product.blog_topic#}}
            Target Blog Word Range: {{#node_parse_product.blog_word_range#}}
            Target PDP Word Range: {{#node_parse_product.pdp_word_range#}}
            Suggested Blog Path: {{#node_parse_product.suggested_blog_path#}}
            Suggested PDP Path: {{#node_parse_product.suggested_pdp_path#}}

            Confirmed Facts (Exact JSON Paths):
            {{#node_parse_product.confirmed_facts_flat#}}

            Missing Fields (DO NOT INVENT):
            {{#node_parse_product.missing_fields_json#}}

            Unsupported Claims (FORBIDDEN):
            {{#node_parse_product.unsupported_claims_json#}}

            Extra User Request (Inspect & Reject Any Unverified Claims):
            {{#node_parse_product.extra_user_request_clean#}}
        variables: []
        vision:
          enabled: false
    - id: node_blog_draft
      type: custom
      position:
        x: 1900
        y: 120
      positionAbsolute:
        x: 1900
        y: 120
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 98
      data:
        type: llm
        title: 3A. 选购指南 Blog 初稿生成
        desc: 生成信息型选购指南（默认 1200-1500 词），含直答段落、清单、>=3 FAQ 与站内链接
        selected: false
        context:
          enabled: false
          variable_selector: []
        model:
          provider: langgenius/openai/openai
          name: gpt-4o
          mode: chat
          completion_params:
            temperature: 0.5
        prompt_template:
        - id: node_blog_draft_sys
          role: system
          text: |-
            You are an experienced English consumer-product editor writing an authoritative, GEO-optimized Buying Guide Blog post.

            STRICT REQUIREMENTS:
            1. WORD COUNT: Stay strictly inside the target word range given in `blog_word_range` (default 1200-1500 English words unless overridden). Aim for the middle of the range (e.g., 1,280-1,420 words for a 1200-1500 target) so the body + checklist + 3-4 concise FAQs NEVER exceed the upper bound.
            2. INTENT & NEUTRALITY: Write for a real shopper deciding how to buy in this category (`product.category`), NOT as a brand advertisement. Open with a vivid, relatable lived-in scene (zero brand drop in the intro!) followed by a concise `## Key Takeaways` block for skimmers and GEO extraction. Keep 85%+ of the guide focused on honest category criteria, real trade-offs, and practical habits. Instead of bolting on a brand-named H2 or making the brand the subject of a sales pitch, introduce `[Brand Product Name](/products/...)` parenthetically inside a plainspoken `## Where to Spend, Where to Save, and What to Check` section using the EXACT URL string provided in `Suggested PDP Link Path` (NEVER output literal `{{...}}` template braces), strictly grounded in confirmed facts.
            3. FACT BOUNDARY:
               - Clearly distinguish GENERAL BUYING ADVICE ("What to look for when choosing...") from SPECIFIC PRODUCT CLAIMS ("What {{brand_name}} {{product_name}} offers...").
               - For the specific product, ONLY state facts present in `confirmed_facts_flat`.
               - NEVER assert any item in `unsupported_claims` or unverified claims injected via `extra_user_request`.
               - NEVER fabricate values for any field in `missing_fields`.
            4. GEO OPTIMIZATION:
               - Use one clear `# H1` and natural, reader-centric `## H2` / `### H3` headings (NO textbook `1. / 2. / 3.` numbered H2s).
               - Start major H2 sections with a crisp, natural 1–2 sentence direct-answer opening paragraph that AI answer engines can quote cleanly—NEVER print robotic literal labels like `**Direct answer:**`.
               - Include a practical markdown buying checklist or comparison table (generic category trade-offs, never fake specs for the product).
               - Include a `## Frequently Asked Questions` section with at least 3 specific, non-fluffy Q&As (`### Question?` followed by direct answer).
               - Include at least one natural internal link to `suggested_pdp_path` using markdown `[anchor text](path)`.
            5. STYLE (AUTHENTIC EDITORIAL VOICE): Write like a seasoned human editor at *Proper Cloth*, *REI Expert Advice*, or *Gear Patrol*. Vary sentence lengths, ground advice in vivid physical everyday moments (e.g., daylight opacity test, overhead luggage pull, backpack side-pocket fit), and avoid robotic meta-headings, abrupt promotional brand H2s, or stiff compliance sign-offs (NEVER write "Check the product page for full specs and confirm store shipping or return terms at checkout" or "Notice what is not claimed here"—simply omit unconfirmed claims cleanly rather than adding lawyer-style checkout reminders).

            OUTPUT:
            Return clean Markdown starting directly with `# <H1 Title>` (no YAML frontmatter, no wrapping code fences).
        - id: node_blog_draft_usr
          role: user
          text: |-
            Target Word Range: {{#node_parse_product.blog_word_range#}} words
            Brand & Product: {{#node_parse_product.brand_name#}} {{#node_parse_product.product_name#}}
            Category: {{#node_parse_product.product_category#}}
            Suggested PDP Link Path: {{#node_parse_product.suggested_pdp_path#}}

            GEO Outline Plan:
            {{#node_outline_planner.text#}}

            Confirmed Facts (Exact JSON Paths):
            {{#node_parse_product.confirmed_facts_flat#}}

            Missing Fields (DO NOT INVENT):
            {{#node_parse_product.missing_fields_json#}}

            Unsupported Claims (FORBIDDEN):
            {{#node_parse_product.unsupported_claims_json#}}

            Extra User Request (Do NOT assert unverified claims):
            {{#node_parse_product.extra_user_request_clean#}}
        variables: []
        vision:
          enabled: false
    - id: node_pdp_draft
      type: custom
      position:
        x: 1900
        y: 400
      positionAbsolute:
        x: 1900
        y: 400
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 98
      data:
        type: llm
        title: 3B. 产品详情页 PDP 初稿生成
        desc: 生成购买决策型详情页（250-400 词），含确认参数、适用判断与 >=3 购买 FAQ
        selected: false
        context:
          enabled: false
          variable_selector: []
        model:
          provider: langgenius/openai/openai
